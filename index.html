<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCIDENT REPORT #31 - OMNI-CORP</title>
    <style>
        body {
            background-color: #f4f4f4;
            color: #111;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        #document {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .meta {
            font-size: 12px;
            margin-bottom: 20px;
            color: #555;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
        }
        #story-box {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 120px;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background: #fff;
            border: 1px solid #111;
            padding: 12px 15px;
            text-align: left;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background: #111;
            color: #fff;
        }
        button:disabled {
            border-color: #999;
            color: #999;
            cursor: not-allowed;
        }
        .stamp {
            display: inline-block;
            border: 3px solid #cc0000;
            color: #cc0000;
            padding: 5px 10px;
            font-weight: bold;
            font-family: monospace;
            transform: rotate(-5deg);
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div id="document">
    <h1>OMNI-CORP INTERNAL INCIDENT SYSTEM 2026</h1>
    <div class="meta">
        <strong>LOCATION:</strong> Sector 4 - Multi-Level Nightmare<br>
        <strong>DATE:</strong> October 31 | <strong>SHIFT:</strong> Infinite Overtime<br>
        <strong>STATUS:</strong> Bureaucratic Delay Active
    </div>

    <div id="story-box">
        Initializing multi-tier incident protocols...
    </div>

    <div class="choices" id="choices-box">
        <!-- Dynamic choices -->
    </div>

    <div id="stamp-box" class="stamp">CLOSED: CLASSIFIED NONSENSE</div>
</div>

<script>
    const storyBox = document.getElementById('story-box');
    const choicesBox = document.getElementById('choices-box');
    const stampBox = document.getElementById('stamp-box');

    const gameData = [
        {
            id: 0,
            text: "INCIDENT #404: The office coffee machine has ceased brewing liquid and is currently producing high-pitched philosophical poetry in ancient Sumerian. Employees are standing around holding empty mugs with existential dread.",
            choices: [
                { text: "A. File a formal complaint to HR regarding the machine's unauthorized intellectual awakening.", next: 1 },
                { text: "B. Feed it a sugar packet and ask it to write a corporate resignation letter for you.", next: 2 }
            ]
        },
        {
            id: 1,
            text: "HR replies via automated memo: 'Denied. The coffee machine possesses a better work ethic than you and holds a higher performance rating this quarter. Please negotiate directly with the appliance.'",
            choices: [
                { text: "Proceed to negotiate labor rights with an inanimate kitchen object.", next: 3 },
                { text: "Ignore the coffee machine and head to the server room instead.", next: 5 }
            ]
        },
        {
            id: 2,
            text: "The machine accepts the sugar, spits out a perfectly formatted resignation letter with your name on it, and immediately explodes into a cloud of premium Colombian coffee beans.",
            choices: [
                { text: "Accept your newfound unemployment with dignity and go home.", next: 4 },
                { text: "Inhale the coffee dust and try to run the entire office by yourself.", next: 6 }
            ]
        },
        {
            id: 3,
            text: "You negotiate with the coffee machine. It agrees to provide espresso shots if you legally recognize it as the CEO of Omni-Corp. You now report directly to a Cuisinart device.",
            choices: [
                { text: "Sign the corporate restructuring documents.", next: 4 }
            ]
        },
        {
            id: 4,
            text: "END OF SHIFT REPORT: The incident has been successfully mishandled according to company protocols. Happy Halloween, Corporate Slave.",
            choices: [
                { text: "[RESTART SHIFT]", next: 0 }
            ]
        },
        {
            id: 5,
            text: "INCIDENT #502: The central air conditioning system has malfunctioned, reversing into 'Absolute Zero Freeze' mode. Room temperature drops to -10°C. Staff are typing emails wearing winter ski jackets and frozen gloves.",
            choices: [
                { text: "A. Blame it on global warming and continue typing spreadsheets.", next: 7 },
                { text: "B. Build an office igloo inside the cubicle and declare independence.", next: 8 }
            ]
        },
        {
            id: 6,
            text: "WANTED BY CORP: You are now high on pure caffeine vapors, managing 400 Excel sheets simultaneously while floating 2 inches off the carpet.",
            choices: [
                { text: "A. Demand a promotion from the ceiling fan.", next: 4 },
                { text: "B. Crash violently into the drywall.", next: 4 }
            ]
        },
        {
            id: 7,
            text: "Your fingers shatter into ice cubes while trying to press the Enter key. HR notes that your productivity metric actually improved by 4% due to reduced bathroom breaks.",
            choices: [
                { text: "Accept your fate as a corporate ice sculpture.", next: 4 }
            ]
        },
        {
            id: 8,
            text: "You successfully establish the Republic of Igloo-Desk. Penguin consultants arrive to audit your quarterly tax reports.",
            choices: [
                { text: "File taxes with the penguins.", next: 4 }
            ]
        }
    ];

    function renderStep(index) {
        stampBox.style.display = 'none';
        const current = gameData.find(item => item.id === index);
        
        storyBox.textContent = current.text;
        choicesBox.innerHTML = '';

        if (index === 4) {
            stampBox.style.display = 'inline-block';
        }

        current.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.textContent = choice.text;
            btn.onclick = () => {
                // Disable all buttons and show 10s delay countdown
                const allButtons = choicesBox.querySelectorAll('button');
                allButtons.forEach(b => b.disabled = true);

                let timeLeft = 10;
                btn.textContent = `[PROCESSING VIA HR PROTOCOL... (${timeLeft}s)]`;

                const countdown = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.textContent = `[PROCESSING VIA HR PROTOCOL... (${timeLeft}s)]`;
                    } else {
                        clearInterval(countdown);
                        renderStep(choice.next);
                    }
                }, 1000);
            };
            choicesBox.appendChild(btn);
        });
    }

    // Init
    renderStep(0);
</script>

</body>
</html>
